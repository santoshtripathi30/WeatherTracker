name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]


jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
	  repo_token: ${{ secrets.GITHUB_TOKEN }}
	  action: "upload"
	  app_location: "WeatherTracker.StaticWeb/src"  # Update this if your static files are elsewhere
          output_location: ""  # Change if using a build process (e.g., React, Angular)

